[project]
name = "sapsucker"
description = "Typed Python wrapper for the SAP GUI Scripting COM API"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["sap", "sapgui", "scripting", "com", "automation", "typed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.0",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/sapsucker/releases"
Homepage = "https://github.com/Hochfrequenz/sapsucker"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "PLR0904", # too-many-public-methods (matches old pylint config)
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
# these modules use lazy imports to avoid circular imports and optional win32 dependencies,
# matching the old `# pylint: disable=import-outside-toplevel` file-level pragmas
"src/sapsucker/__init__.py" = ["PLC0415"]
"src/sapsucker/_com.py" = ["PLC0415"]
"src/sapsucker/login.py" = ["PLC0415"]
"src/sapsucker/components/application.py" = ["PLC0415"]
"src/sapsucker/components/base.py" = ["PLC0415"]
"src/sapsucker/components/connection.py" = ["PLC0415"]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_sapsucker_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["unittests"]

[tool.uv]
default-groups = []

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]
linting = [
    "ruff==0.15.1",
]
type_check = [
    "mypy==2.3.1",
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.4",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
]
