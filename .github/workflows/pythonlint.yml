name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    # Name pinned to matrix.group ONLY. Without an explicit name, GitHub appends
    # every matrix value — including the multi-line `commands` — so the check
    # reports as "Python Code Quality and Lint (linting, uv run ruff check
    # src/sapsucker examples" (truncated, newline and all). That does not match
    # the "Python Code Quality and Lint (linting)" context required by the branch
    # ruleset, and it changes whenever a command is edited. Same reasoning as the
    # comment in formatting.yml.
    name: "Python Code Quality and Lint (${{ matrix.group }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - group: linting
            commands: |
              uv run ruff check src/sapsucker examples
          - group: type_check
            commands: |
              uv run mypy --show-error-codes src/sapsucker --strict
              uv run mypy --show-error-codes examples/sapsucker --strict --ignore-missing-imports
          - group: spell_check
            commands: |
              uv run codespell --ignore-words=domain-specific-terms.txt src
              uv run codespell --ignore-words=domain-specific-terms.txt examples
              uv run codespell --ignore-words=domain-specific-terms.txt README.md
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.group }}
      - name: Run ${{ matrix.group }}
        run: ${{ matrix.commands }}
