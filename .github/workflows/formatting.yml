name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  format:
    # Job name intentionally still says "black"/"isort" to preserve the required-status-check
    # names configured in the branch ruleset; both matrix entries now run ruff under the hood.
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: ruff format --check .
          - tool: isort
            command: ruff check --select I .
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run ${{ matrix.command }}
